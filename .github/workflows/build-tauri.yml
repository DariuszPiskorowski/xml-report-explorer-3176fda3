# Workflow do ręcznego budowania aplikacji desktopowej (.exe) za pomocą Tauri
name: Build Tauri Desktop App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite frontend
        run: npm run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Add x86_64 target (for Rust)
        run: rustup target add x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli

      - name: Build Windows x86_64 exe
        run: npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-windows-exe
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
