# CI/CD Pipeline Configuration
name: Build XML Log Viewer exe (Tauri)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install npm dependencies
        run: npm install

      - name: Build Vite frontend
        run: npm run build

      - name: Verify frontend bundle
        run: |
          if (!(Test-Path "dist/client/index.html")) {
            Write-Error "Missing dist/client/index.html - Tauri would build an empty shell."
          }
        shell: pwsh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Add x86_64 target (for Rust)
        run: rustup target add x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: npm install --save-dev @tauri-apps/cli

      - name: Build Windows x86_64 exe (no installer)
        run: npx tauri build --target x86_64-pc-windows-msvc --no-bundle

      - name: Verify exe output
        run: |
          $exe = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/*.exe" | Select-Object -First 1
          if (-not $exe -or $exe.Length -lt 100000) {
            Write-Error "Missing or empty .exe output."
          } else {
            Write-Host "Built: $($exe.FullName) ($([math]::Round($exe.Length/1MB,2)) MB)"
          }
        shell: pwsh

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: XML-Log-Viewer-exe
          path: src-tauri/target/x86_64-pc-windows-msvc/release/*.exe
          if-no-files-found: error
